# ClanChat — Render Blueprint (web deploy)
# Backend = FastAPI web service, Frontend = static Vite SPA.
# Secrets (sync:false) must be filled in the Render dashboard; NEVER commit real values.
services:
  # ---------------- Backend (FastAPI) ----------------
  - type: web
    name: clanchat-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL          # MongoDB Atlas URI (Render has no built-in Mongo)
        sync: false
      - key: DB_NAME
        value: clanchat
      - key: SUPABASE_URL
        value: https://fkhsijjwkrwbwjjaapbb.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_BUCKET
        value: clanchat-media
      - key: DM_ENC_KEY         # base64 32-byte key; keep STABLE or old DMs won't decrypt
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ADMIN_EMAILS       # comma-separated admin emails (your Google email)
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://clanchatapp.onrender.com

  # ---------------- Frontend (static Vite SPA) ----------------
  - type: web
    name: clanchat-web
    runtime: static
    buildCommand: yarn install && yarn build
    staticPublishPath: dist
    routes:
      - type: rewrite       # SPA: send all paths to index.html for react-router
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_SUPABASE_URL
        value: https://fkhsijjwkrwbwjjaapbb.supabase.co
      - key: REACT_APP_SUPABASE_ANON_KEY
        sync: false
      - key: REACT_APP_GOOGLE_WEB_CLIENT_ID
        value: 286762294730-2hu26blabiqf39os0vfpv5i8ap645dqr.apps.googleusercontent.com
      - key: REACT_APP_API_URL   # absolute backend URL (e.g. https://clanchat-backend.onrender.com)
        sync: false
