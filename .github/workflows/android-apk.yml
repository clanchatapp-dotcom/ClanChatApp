name: Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Yarn
        run: corepack enable || npm i -g yarn

      # Vite bakes REACT_APP_* at build time. Public values fall back to defaults;
      # secrets (anon key, backend URL) come from repo Settings > Secrets and variables > Actions.
      - name: Write frontend .env
        run: |
          cat > .env <<EOF
          REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL || 'https://fkhsijjwkrwbwjjaapbb.supabase.co' }}
          REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_GOOGLE_WEB_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_WEB_CLIENT_ID || '286762294730-2hu26blabiqf39os0vfpv5i8ap645dqr.apps.googleusercontent.com' }}
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          EOF

      - name: Install deps
        run: yarn install --frozen-lockfile || yarn install

      - name: Build web
        run: yarn build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true

      - name: Capacitor sync (adds android if missing)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # Shared keystore keeps the SHA-1 STABLE across builds so Google sign-in keeps working.
      # Create the secret: base64 -w0 android/app/debug.keystore
      - name: Restore shared debug keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using shared debug keystore. SHA-1:"
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep SHA1 || true
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — a random debug keystore will be used and Google sign-in will fail until its SHA-1 is registered. Set the secret for stable, working builds."
          fi

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clanchat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
